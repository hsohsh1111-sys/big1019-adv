apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: edu
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: redis          # 다른 Pod는 'redis' 라는 이름으로 접속
  namespace: edu
spec:
  selector: { app: redis }
  ports:
    - port: 6379
