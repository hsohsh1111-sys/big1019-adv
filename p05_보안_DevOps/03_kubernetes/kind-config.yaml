# 로컬 쿠버네티스 클러스터 (kind = Kubernetes IN Docker)
#   kind create cluster --name edu --config kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080   # NodePort → 내 PC의 localhost:30080
        hostPort: 30080
  - role: worker
  - role: worker
