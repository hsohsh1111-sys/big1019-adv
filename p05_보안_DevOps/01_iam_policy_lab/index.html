<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>IAM 정책 & 보안 그룹 실습</title>
<style>
  body { font-family: 'Malgun Gothic', sans-serif; max-width: 1080px; margin: 24px auto; padding: 0 16px; color: #222; }
  section { border: 1px solid #ddd; border-radius: 8px; padding: 10px 16px; margin: 14px 0; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  label.f { display: block; margin-top: 8px; font-size: 13px; font-weight: bold; }
  input[type=text], select, textarea { width: 100%; box-sizing: border-box; padding: 6px 8px; font-size: 13px; }
  textarea { font-family: Consolas, monospace; }
  button { padding: 6px 12px; cursor: pointer; margin: 6px 4px 0 0; }
  .sc { font-size: 12px; padding: 3px 8px; }
  .decision { font-size: 30px; font-weight: bold; margin: 8px 0; }
  .ALLOW { color: #188038; } .DENY { color: #d93025; }
  pre { background: #f6f8fa; padding: 8px; border-radius: 6px; font-size: 12px; white-space: pre-wrap; max-height: 260px; overflow: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border: 1px solid #ccc; padding: 4px 8px; text-align: left; }
  th { background: #dce6f2; }
  .치명 { background: #fce8e6; } .높음 { background: #fef7e0; }
  .muted { color: #888; font-size: 13px; }
</style>
</head>
<body>
<h1>클라우드 보안 정책 실습 <small class="muted">IAM 정책 시뮬레이터 · 보안 그룹 점검 (AWS 계정 불필요)</small></h1>

<section>
  <h2>① IAM 정책 시뮬레이터</h2>
  <div class="muted">시나리오: <span id="scenarios"></span></div>
  <div class="grid">
    <div>
      <label class="f">적용할 정책</label>
      <div id="policyChecks"></div>
      <label class="f">Action (무엇을)</label><input type="text" id="action" value="s3:GetObject">
      <label class="f">Resource (어디에)</label><input type="text" id="resource" value="arn:aws:s3:::myapp-uploads/a.png">
      <label class="f">요청 컨텍스트 — aws:SourceIp (접속 IP)</label><input type="text" id="ip" placeholder="예: 203.0.113.25">
      <label class="f">aws:MultiFactorAuthPresent (MFA 로그인 여부)</label>
      <select id="mfa"><option value="">(정보 없음)</option><option>true</option><option>false</option></select>
      <label class="f">aws:RequestedRegion (요청 리전)</label><input type="text" id="region" placeholder="예: ap-northeast-2">
      <label class="f">내 정책 (선택) — JSON을 직접 작성해 함께 적용</label>
      <textarea id="custom" rows="6" placeholder='{"Statement": [{"Sid": "MyRule", "Effect": "Deny", "Action": "ec2:*", "Resource": "*", "Condition": {"StringEquals": {"aws:RequestedRegion": ["us-east-1"]}}}]}'></textarea>
      <button onclick="evaluate()">판정</button>
    </div>
    <div>
      <div class="decision" id="decision">-</div>
      <div id="reason" class="muted"></div>
      <h4>정책 내용 <small class="muted">(정책 이름 클릭)</small></h4>
      <div id="policyLinks"></div>
      <pre id="policyView"></pre>
    </div>
  </div>
</section>

<section>
  <h2>② 최소 권한 점검 (Lint)</h2>
  <ul id="lint"></ul>
</section>

<section>
  <h2>③ 보안 그룹(방화벽) 점검 <small class="muted" id="sgCount"></small></h2>
  <table><thead><tr><th>위험도</th><th>보안 그룹</th><th>0.0.0.0/0 → 포트</th><th>조치</th></tr></thead><tbody id="sg"></tbody></table>
</section>

<script>
const $ = id => document.getElementById(id);
let POLICIES = {};

function fillForm(s) {
  document.querySelectorAll('#policyChecks input').forEach(cb => cb.checked = s.policies.includes(cb.value));
  $('action').value = s.action; $('resource').value = s.resource;
  $('ip').value = s.context['aws:SourceIp'] || '';
  $('mfa').value = s.context['aws:MultiFactorAuthPresent'] || '';
  $('region').value = s.context['aws:RequestedRegion'] || '';
  evaluate();
}

async function evaluate() {
  let custom = null;
  if ($('custom').value.trim()) {
    try { custom = JSON.parse($('custom').value); } catch (e) { $('decision').textContent = 'JSON 오류'; $('reason').textContent = e.message; return; }
  }
  const body = {
    policies: [...document.querySelectorAll('#policyChecks input:checked')].map(cb => cb.value), custom,
    action: $('action').value, resource: $('resource').value,
    context: { 'aws:SourceIp': $('ip').value, 'aws:MultiFactorAuthPresent': $('mfa').value, 'aws:RequestedRegion': $('region').value },
  };
  const res = await fetch('/api/evaluate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const r = await res.json();
  if (!res.ok) { $('decision').textContent = '오류'; $('decision').className = 'decision DENY'; $('reason').textContent = JSON.stringify(r.detail); return; }
  $('decision').textContent = (r.decision === 'ALLOW' ? '✅ ' : '❌ ') + r.decision;
  $('decision').className = 'decision ' + r.decision;
  $('reason').textContent = r.reason;
}

(async () => {
  POLICIES = await (await fetch('/api/policies')).json();
  Object.keys(POLICIES).forEach(name => {
    $('policyChecks').insertAdjacentHTML('beforeend', `<label style="margin-right:12px"><input type="checkbox" value="${name}"> ${name}</label>`);
    const b = document.createElement('button'); b.className = 'sc'; b.textContent = name;
    b.onclick = () => $('policyView').textContent = JSON.stringify(POLICIES[name], null, 2);
    $('policyLinks').appendChild(b);
  });
  const scenarios = await (await fetch('/api/scenarios')).json();
  scenarios.forEach(s => {
    const b = document.createElement('button'); b.className = 'sc'; b.textContent = s.desc; b.onclick = () => fillForm(s);
    $('scenarios').appendChild(b);
  });
  fillForm(scenarios[0]);

  (await (await fetch('/api/lint')).json()).forEach(w => { const li = document.createElement('li'); li.textContent = w; $('lint').appendChild(li); });

  const sg = await (await fetch('/api/sg-audit')).json();
  $('sgCount').textContent = `보안 그룹 ${sg.groups}개 점검 — 발견 ${sg.findings.length}건`;
  sg.findings.forEach(f => {
    const tr = document.createElement('tr'); tr.className = f.level;
    [f.level, f.group, f.port, f.fix].forEach(v => { const td = document.createElement('td'); td.textContent = v; tr.appendChild(td); });
    $('sg').appendChild(tr);
  });
})();
</script>
</body>
</html>
