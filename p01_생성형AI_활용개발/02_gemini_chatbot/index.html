<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Gemini 챗봇 & 자동 응답</title>
<style>
  body { font-family: 'Malgun Gothic', sans-serif; max-width: 820px; margin: 30px auto; padding: 0 16px; color: #222; }
  section { border: 1px solid #ddd; border-radius: 8px; padding: 12px 16px; margin: 16px 0; }
  #chat { height: 240px; overflow-y: auto; background: #fafafa; padding: 8px; border-radius: 6px; }
  .msg { margin: 6px 0; padding: 8px 12px; border-radius: 12px; max-width: 80%; white-space: pre-wrap; }
  .user { background: #1a73e8; color: #fff; margin-left: auto; }
  .assistant { background: #e8f0fe; }
  .row { display: flex; gap: 6px; margin-top: 8px; }
  input { flex: 1; padding: 8px; font-size: 14px; }
  button { padding: 8px 14px; cursor: pointer; }
  .sample { font-size: 12px; padding: 4px 8px; margin: 2px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; color: #fff; font-size: 12px; font-weight: bold; }
  .FAQ { background: #188038; } .AI { background: #1a73e8; } .상담원 { background: #d93025; }
  .log { border-bottom: 1px dashed #ccc; padding: 6px 0; }
  .muted { color: #888; font-size: 13px; }
  details { margin-top: 8px; font-size: 13px; }
</style>
</head>
<body>
<h1>Gemini 챗봇 & 자동 응답 <small class="muted" id="mode"></small></h1>

<section>
  <h2>① 코딩 도우미 챗봇 <small class="muted">(대화 기억)</small></h2>
  <div id="chat"></div>
  <div class="row">
    <input id="q" placeholder="예: 파이썬 리스트가 뭐야?">
    <button onclick="send()">보내기</button>
    <button onclick="history = []; renderChat()">새 대화</button>
  </div>
</section>

<section>
  <h2>② 쇼핑몰 FAQ 자동 응답 <small class="muted">마스킹 → FAQ → AI → 검증</small></h2>
  <div id="samples"></div>
  <div class="row">
    <input id="inq" placeholder="고객 문의를 입력하세요">
    <button onclick="inquire()">문의</button>
  </div>
  <div id="logs"></div>
  <details><summary>등록된 FAQ 보기</summary><ul id="faq"></ul></details>
</section>

<script>
const $ = id => document.getElementById(id);
let history = [];

function renderChat() {
  $('chat').innerHTML = '';
  history.forEach(m => $('chat').append(el('div', 'msg ' + m.role, m.content)));
  $('chat').scrollTop = $('chat').scrollHeight;
}

async function post(url, body) {
  const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

async function send() {
  const content = $('q').value.trim();
  if (!content) return;
  history.push({ role: 'user', content });
  $('q').value = ''; renderChat();
  try {
    const data = await post('/api/chat', { history });
    history.push({ role: 'assistant', content: data.answer });
  } catch (e) { alert(e); history.pop(); }
  renderChat();
}

async function inquire(text) {
  const question = text ?? $('inq').value.trim();
  if (!question) return;
  $('inq').value = '';
  const r = await post('/api/reply', { question });
  const div = el('div', 'log');
  div.append(el('div', '', '문의: ' + question));
  if (r.masked !== question) div.append(el('div', 'muted', '↳ 마스킹: ' + r.masked));
  const answer = el('div');
  answer.append(el('span', 'badge ' + r.source, r.source), ' ' + r.answer);
  div.append(answer);
  $('logs').prepend(div);
}

// textContent로 넣어서 사용자 입력이 HTML로 실행되지 않게 한다 (XSS 방지)
function el(tag, cls = '', text = '') {
  const e = document.createElement(tag);
  e.className = cls; e.textContent = text;
  return e;
}

$('q').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
$('inq').addEventListener('keydown', e => { if (e.key === 'Enter') inquire(); });

fetch('/api/info').then(r => r.json()).then(d => {
  $('mode').textContent = d.mode;
  d.samples.forEach(s => {
    const b = el('button', 'sample', s);
    b.onclick = () => inquire(s);
    $('samples').append(b);
  });
  d.faq.forEach(f => $('faq').append(el('li', '', `[${f.keywords.join(', ')}] ${f.answer}`)));
});
</script>
</body>
</html>
