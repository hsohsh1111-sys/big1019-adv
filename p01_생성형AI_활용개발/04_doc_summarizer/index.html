<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>회의록 요약 & 보고서 생성</title>
<style>
  body { font-family: 'Malgun Gothic', sans-serif; max-width: 900px; margin: 30px auto; padding: 0 16px; color: #222; }
  textarea { width: 100%; box-sizing: border-box; padding: 8px; font-size: 13px; }
  button { padding: 8px 16px; cursor: pointer; margin: 6px 4px 6px 0; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .card { border: 1px solid #ddd; border-radius: 8px; padding: 10px 14px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border: 1px solid #ccc; padding: 4px 8px; text-align: left; }
  th { background: #dce6f2; }
  pre { background: #f6f8fa; padding: 10px; border-radius: 6px; white-space: pre-wrap; font-size: 13px; }
  .warn { color: #d93025; font-weight: bold; }
  .muted { color: #888; font-size: 13px; }
</style>
</head>
<body>
<h1>회의록 요약 & 보고서 자동 생성</h1>
<p class="muted">회의록을 붙여 넣고 실행하면 3줄 요약 · 결정사항 · 할 일 표 · Markdown 보고서를 만듭니다.</p>

<textarea id="text" rows="12"></textarea>
<button onclick="run()">요약 실행</button>
<button onclick="loadSample()">샘플 다시 불러오기</button>
<span class="muted" id="mode"></span>
<p class="warn" id="missing"></p>

<div class="grid">
  <div class="card"><h3>요약</h3><pre id="summary">-</pre></div>
  <div class="card"><h3>결정사항</h3><ol id="decisions"></ol></div>
</div>
<div class="card" style="margin-top:16px">
  <h3>할 일</h3>
  <table><thead><tr><th>담당</th><th>할 일</th><th>기한</th></tr></thead><tbody id="todos"></tbody></table>
</div>
<h3>Markdown 보고서 <button onclick="download()">report.md 다운로드</button></h3>
<pre id="report"></pre>

<script>
const $ = id => document.getElementById(id);
const cell = (tr, text) => { const td = document.createElement('td'); td.textContent = text; tr.appendChild(td); };

async function loadSample() {
  $('text').value = (await (await fetch('/api/sample')).json()).text;
}

async function run() {
  $('mode').textContent = '처리 중...';
  const res = await fetch('/api/summarize', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: $('text').value }),
  });
  if (!res.ok) return alert('요청 실패: ' + res.status + ' (20자 이상 입력하세요)');
  const r = await res.json();
  $('mode').textContent = '생성 방식: ' + r.mode;
  $('missing').textContent = r.missing.length ? '⚠ 추출되지 않은 항목: ' + r.missing.join(', ') : '';
  $('summary').textContent = r.summary;
  $('decisions').innerHTML = '';
  r.info.decisions.forEach(d => { const li = document.createElement('li'); li.textContent = d; $('decisions').appendChild(li); });
  $('todos').innerHTML = '';
  r.info.todos.forEach(t => { const tr = document.createElement('tr'); [t.owner, t.task, t.due].forEach(v => cell(tr, v)); $('todos').appendChild(tr); });
  $('report').textContent = r.report;
}

function download() {
  const blob = new Blob([$('report').textContent], { type: 'text/markdown' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'report.md'; a.click();
}

loadSample();
</script>
</body>
</html>
