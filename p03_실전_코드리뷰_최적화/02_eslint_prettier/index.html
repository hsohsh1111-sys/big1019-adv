<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>ESLint & Prettier 플레이그라운드</title>
<style>
  body { font-family: 'Malgun Gothic', sans-serif; max-width: 1100px; margin: 30px auto; padding: 0 16px; color: #222; }
  .grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; }
  textarea { width: 100%; height: 420px; box-sizing: border-box; font-family: Consolas, monospace; font-size: 13px;
             background: #1e1e1e; color: #d4d4d4; padding: 10px; border-radius: 6px; tab-size: 2; }
  button, select { padding: 7px 12px; font-size: 14px; margin: 0 4px 8px 0; cursor: pointer; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border: 1px solid #ccc; padding: 4px 6px; text-align: left; }
  th { background: #dce6f2; }
  .error { color: #d93025; font-weight: bold; } .warning { color: #e37400; font-weight: bold; }
  pre { background: #f6f8fa; padding: 10px; border-radius: 6px; white-space: pre-wrap; font-size: 13px; min-height: 40px; }
  .ok { color: #188038; font-weight: bold; }
  .muted { color: #888; font-size: 13px; }
</style>
<!-- 브라우저용 ESLint / Prettier (package.json 의 버전과 맞춤) -->
<script src="https://cdn.jsdelivr.net/npm/eslint-linter-browserify@9.39.2/linter.min.js"></script>
<script src="https://unpkg.com/prettier@3.4.2/standalone.js"></script>
<script src="https://unpkg.com/prettier@3.4.2/plugins/babel.js"></script>
<script src="https://unpkg.com/prettier@3.4.2/plugins/estree.js"></script>
</head>
<body>
<h1>ESLint & Prettier 플레이그라운드</h1>
<p class="muted">ESLint = 버그·나쁜 패턴 찾기 / Prettier = 코드 모양(들여쓰기·따옴표·세미콜론) 통일. 코드를 직접 고쳐 가며 버튼을 눌러 보세요.</p>

<select id="file" onchange="loadFile()">
  <option value="src/cart.js">src/cart.js (❌ 문제 코드)</option>
  <option value="src/cart_fixed.js">src/cart_fixed.js (✅ 수정본)</option>
</select>
<button onclick="lint()">① ESLint 검사</button>
<button onclick="format()">② Prettier 포맷</button>
<button onclick="run()">③ 실행</button>

<div class="grid">
  <textarea id="code" spellcheck="false"></textarea>
  <div>
    <h3>ESLint 결과 <span id="lintSummary"></span></h3>
    <table><thead><tr><th>줄</th><th>심각도</th><th>규칙</th><th>메시지</th></tr></thead><tbody id="lint"></tbody></table>
    <h3>실행 결과 (console)</h3>
    <pre id="console"></pre>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

// eslint.config.js 와 같은 규칙 (js.configs.recommended 중 대표 규칙 + 직접 추가한 규칙)
const ESLINT_CONFIG = [{
  languageOptions: { ecmaVersion: 2022, sourceType: 'module', globals: { console: 'readonly' } },
  rules: {
    'no-unused-vars': 'error',   // 선언만 하고 안 쓰는 변수
    'no-undef': 'error',         // 선언하지 않은 변수 사용 → 실행하면 ReferenceError
    eqeqeq: 'error',             // == 금지, === 사용
    'no-var': 'error',           // var 금지
    'prefer-const': 'warn',      // 재할당 없는 변수는 const
    complexity: ['warn', 6],     // 분기가 너무 많은 함수
  },
}];
let prettierOptions = {};

async function loadFile() {
  $('code').value = await (await fetch($('file').value)).text();
  lint();
}

function lint() {
  const messages = new eslint.Linter().verify($('code').value, ESLINT_CONFIG, { filename: 'cart.js' });
  const errors = messages.filter(m => m.severity === 2).length;
  $('lintSummary').innerHTML = messages.length
    ? `<span class="error">오류 ${errors}</span> / <span class="warning">경고 ${messages.length - errors}</span>`
    : '<span class="ok">✔ 문제 없음</span>';
  $('lint').innerHTML = '';
  messages.forEach(m => {
    const tr = document.createElement('tr');
    [m.line, m.severity === 2 ? 'error' : 'warning', m.ruleId ?? '구문 오류', m.message].forEach((v, i) => {
      const td = document.createElement('td');
      td.textContent = v;
      if (i === 1) td.className = v;
      tr.appendChild(td);
    });
    $('lint').appendChild(tr);
  });
}

async function format() {
  try {
    $('code').value = await prettier.format($('code').value, { parser: 'babel', plugins: prettierPlugins, ...prettierOptions });
    lint();
  } catch (e) {
    $('console').textContent = 'Prettier 실패 (문법 오류가 있으면 포맷할 수 없습니다):\n' + e.message;
  }
}

// 코드를 ES 모듈로 실행하고 console.log 출력을 화면에 모은다
async function run() {
  const lines = [];
  const original = console.log;
  console.log = (...args) => { lines.push(args.join(' ')); original(...args); };
  try {
    const url = URL.createObjectURL(new Blob([$('code').value], { type: 'text/javascript' }));
    await import(url);
    lines.push('✔ 정상 종료');
  } catch (e) {
    lines.push(`❌ ${e.name}: ${e.message}`);
  } finally {
    console.log = original;
  }
  $('console').textContent = lines.join('\n');
}

fetch('.prettierrc.json').then(r => r.json()).then(o => prettierOptions = o).catch(() => {});
loadFile();
</script>
</body>
</html>
