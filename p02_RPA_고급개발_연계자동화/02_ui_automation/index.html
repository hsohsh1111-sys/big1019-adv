<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>UI 자동화 대시보드</title>
<style>
  body { font-family: 'Malgun Gothic', sans-serif; max-width: 900px; margin: 30px auto; padding: 0 16px; color: #222; }
  section { border: 1px solid #ddd; border-radius: 8px; padding: 10px 16px; margin: 14px 0; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border: 1px solid #ccc; padding: 4px 8px; text-align: left; }
  th { background: #dce6f2; }
  button { padding: 8px 16px; cursor: pointer; }
  pre { background: #1e1e1e; color: #d4d4d4; padding: 10px; border-radius: 6px; font-size: 13px; white-space: pre-wrap; }
  .ok { color: #188038; font-weight: bold; } .fail { color: #d93025; font-weight: bold; }
  img { max-width: 100%; border: 1px solid #ccc; }
  .muted { color: #888; font-size: 13px; }
</style>
</head>
<body>
<h1>UI 자동화(RPA) 대시보드</h1>

<section>
  <h2>① 입력할 명단 <small class="muted">applicants.xlsx</small></h2>
  <table><thead><tr><th>이름</th><th>이메일</th><th>과정</th></tr></thead><tbody id="applicants"></tbody></table>
</section>

<section>
  <h2>② 자동화 대상 시스템</h2>
  <p><a href="/form" target="_blank">교육 신청 시스템 열기</a> — 먼저 <b>사람처럼 한 명을 직접 입력</b>해 보세요. 이 과정을 봇이 대신합니다.</p>
</section>

<section>
  <h2>③ 봇 실행</h2>
  <label><input type="checkbox" id="show" checked> 브라우저 창 보기 (천천히 입력하는 모습)</label>
  <button onclick="run()">봇 실행</button>
  <span id="status" class="muted"></span>
  <pre id="log">실행 로그가 여기에 표시됩니다.</pre>
  <table><thead><tr><th>이름</th><th>이메일</th><th>과정</th><th>결과</th><th>메시지</th></tr></thead><tbody id="results"></tbody></table>
  <h3>마지막 화면 스크린샷</h3>
  <img id="shot" alt="봇 실행 후 표시">
</section>

<script>
const $ = id => document.getElementById(id);

function fill(id, rows) {
  $(id).innerHTML = '';
  rows.forEach(r => {
    const tr = document.createElement('tr');
    r.forEach(v => {
      const td = document.createElement('td');
      td.textContent = v;
      if (v === '성공') td.className = 'ok';
      if (v === '실패') td.className = 'fail';
      tr.appendChild(td);
    });
    $(id).appendChild(tr);
  });
}

async function run() {
  $('status').textContent = '실행 중... (브라우저 창을 닫지 마세요)';
  const res = await fetch('/api/run', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ show: $('show').checked }) });
  const data = await res.json();
  if (!res.ok) { $('status').textContent = '실패'; $('log').textContent = data.detail; return; }
  $('status').textContent = '완료';
  $('log').textContent = data.log;
  fill('results', data.results);
  $('shot').src = '/screenshot.png?t=' + Date.now();   // 캐시 방지
}

fetch('/api/applicants').then(r => r.json()).then(rows => fill('applicants', rows));
</script>
</body>
</html>
