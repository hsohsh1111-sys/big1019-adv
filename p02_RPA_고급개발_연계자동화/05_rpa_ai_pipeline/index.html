<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>RPA + AI 파이프라인</title>
<style>
  body { font-family: 'Malgun Gothic', sans-serif; max-width: 1000px; margin: 30px auto; padding: 0 16px; color: #222; }
  .flow { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
  .stage { border: 2px solid #ccc; border-radius: 8px; padding: 8px 12px; min-width: 130px; text-align: center; }
  .stage.done { border-color: #188038; background: #e6f4ea; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; margin-bottom: 16px; }
  th, td { border: 1px solid #ccc; padding: 4px 8px; text-align: left; }
  th { background: #dce6f2; }
  .low { background: #fce8e6; }
  .scroll { max-height: 300px; overflow-y: auto; }
  button, input { padding: 7px 12px; font-size: 14px; }
  pre { background: #f6f8fa; padding: 10px; border-radius: 6px; white-space: pre-wrap; font-size: 13px; }
  .bar { background: #4a7bd0; height: 14px; display: inline-block; vertical-align: middle; }
  .muted { color: #888; font-size: 13px; }
</style>
</head>
<body>
<h1>RPA + AI 비즈니스 자동화 파이프라인</h1>

<p>
  페이지 <input id="pages" type="number" value="1" min="1" max="3" style="width:60px">
  <label><input type="checkbox" id="offline"> 오프라인(샘플 데이터)</label>
  <button onclick="run()">파이프라인 실행</button>
  <span id="status" class="muted"></span>
</p>

<div class="flow">
  <div class="stage" id="s1">① 수집 (RPA)<br><small id="s1t">-</small></div>→
  <div class="stage" id="s2">② 분류 (AI)<br><small id="s2t">-</small></div>→
  <div class="stage" id="s3">③ 검토 분기<br><small id="s3t">-</small></div>→
  <div class="stage" id="s4">④ 보고<br><small id="s4t">-</small></div>
</div>

<h3>주제별 통계</h3>
<table><thead><tr><th>주제</th><th>건수</th><th>긍정비율</th></tr></thead><tbody id="stats"></tbody></table>

<h3>사람 검토 필요 <small class="muted" id="th"></small></h3>
<table><thead><tr><th>id</th><th>명언</th><th>주제</th><th>확신도</th></tr></thead><tbody id="review"></tbody></table>

<h3>전체 결과</h3>
<div class="scroll">
  <table><thead><tr><th>id</th><th>명언</th><th>저자</th><th>주제</th><th>감정</th><th>확신도</th><th>요약</th></tr></thead><tbody id="rows"></tbody></table>
</div>

<h3>④ 보고 <span id="files" style="display:none">📥 <a href="/download/quotes_report.xlsx">quotes_report.xlsx</a> · <a href="/download/notify.eml">notify.eml</a></span></h3>
<pre id="mail">알림 메일 초안이 여기에 표시됩니다.</pre>

<script>
const $ = id => document.getElementById(id);

function fill(id, rows, cols, rowClass) {
  $(id).innerHTML = '';
  rows.forEach(r => {
    const tr = document.createElement('tr');
    if (rowClass) tr.className = rowClass(r);
    cols.forEach(c => {
      const td = document.createElement('td');
      if (typeof c === 'function') td.append(c(r)); else td.textContent = r[c];
      tr.appendChild(td);
    });
    $(id).appendChild(tr);
  });
}

function bar(count, max) {
  const span = document.createElement('span');
  const b = document.createElement('span');
  b.className = 'bar'; b.style.width = (count / max * 200) + 'px';
  span.append(b, ' ' + count);
  return span;
}

async function run() {
  document.querySelectorAll('.stage').forEach(s => s.classList.remove('done'));
  $('status').textContent = '실행 중...';
  const res = await fetch('/api/run', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ pages: Number($('pages').value), offline: $('offline').checked }) });
  const d = await res.json();
  if (!res.ok) return $('status').textContent = '실패: ' + JSON.stringify(d.detail);
  $('status').textContent = '완료';
  $('s1t').textContent = `${d.source} ${d.count}건`;
  $('s2t').textContent = d.mode;
  $('s3t').textContent = `검토 필요 ${d.review.length}건`;
  $('s4t').textContent = '엑셀 + 메일 초안';
  document.querySelectorAll('.stage').forEach(s => s.classList.add('done'));
  $('th').textContent = `(확신도 ${d.threshold} 미만 → 자동 처리하지 않고 사람에게)`;

  const max = Math.max(...d.stats.map(s => s['건수']));
  fill('stats', d.stats, ['주제', r => bar(r['건수'], max), '긍정비율']);
  fill('review', d.review, ['id', '명언', '주제', '확신도']);
  fill('rows', d.rows, ['id', '명언', '저자', '주제', '감정', '확신도', '요약'], r => r['확신도'] < d.threshold ? 'low' : '');
  $('mail').textContent = d.mail;
  $('files').style.display = 'inline';
}
</script>
</body>
</html>
